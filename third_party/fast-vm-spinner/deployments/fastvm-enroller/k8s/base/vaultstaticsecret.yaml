apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fastvm-enroller
spec:
  vaultAuthRef: fastvm-enroller
  namespace: infra-bare-metal-squad
  type: kv-v2
  mount: infra-bare-metal-squad
  path: fastvm-enroller
  destination:
    name: fastvm-enroller
    create: true
    type: Opaque
  refreshAfter: 30m
  rolloutRestartTargets:
    - kind: Deployment
      name: fastvm-enroller
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fastvm-enroller-lacework
spec:
  vaultAuthRef: fastvm-enroller
  namespace: infra-bare-metal-squad
  type: kv-v2
  mount: infraops-squad
  path: infra-roles-lacework-agent
  destination:
    name: fastvm-enroller-lacework
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      includes:
        - agent_access_token
  refreshAfter: 30m
  rolloutRestartTargets:
    - kind: Deployment
      name: fastvm-enroller
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fastvm-enroller-crowdstrike
spec:
  vaultAuthRef: fastvm-enroller
  namespace: infra-bare-metal-squad
  type: kv-v2
  mount: infraops-squad
  path: infra-roles-crowdstrike-falcon
  destination:
    name: fastvm-enroller-crowdstrike
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      includes:
        - crowdstrike_customer_id
  refreshAfter: 30m
  rolloutRestartTargets:
    - kind: Deployment
      name: fastvm-enroller
